<script>
    // MASUKKAN URL WEB APP GOOGLE SCRIPT ANDA DI SINI
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw3fWPsl2agyVYO2Io8fnAv2nEzYAQdsdF5Q3VIqqmwFA1QMUVC-InmG6mQ0HDrqZ3m/exec';

    const parseAngka = (val) => {
      if (val === undefined || val === null || val === '') return 0;
      let str = val.toString().replace(/Rp/gi, '').trim();
      str = str.replace(/,00$/, '').replace(/\.00$/, '');
      str = str.replace(/\./g, '').replace(/,/g, '');
      let num = parseFloat(str);
      return isNaN(num) ? 0 : num;
    }

    const formatRp = (val) => {
      let num = parseAngka(val);
      if (num === 0) return ""; 
      return new Intl.NumberFormat('id-ID').format(num);
    }

    // Mengambil daftar bulan melalui Fetch API saat halaman dimuat
    document.addEventListener("DOMContentLoaded", async function() {
      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getMonths' })
        });
        
        const result = await response.json();
        
        const select = document.getElementById('bulan');
        select.innerHTML = '';
        
        if(result.status === 'success' && result.data.length > 0) {
           result.data.forEach(m => {
             let opt = document.createElement('option');
             opt.value = m;
             opt.innerHTML = m;
             select.appendChild(opt);
           });
        } else {
           select.innerHTML = '<option value="">Belum ada data bulan</option>';
        }
        document.getElementById('btn-login').innerText = 'Masuk';
        document.getElementById('btn-login').disabled = false;

      } catch (error) {
        console.error("Gagal memuat bulan:", error);
        document.getElementById('bulan').innerHTML = '<option value="">Gagal memuat sistem</option>';
      }
    });

    // Proses Login menggunakan Fetch API
    async function handleLogin(e) {
      e.preventDefault();
      const nip = document.getElementById('nip').value;
      const pass = document.getElementById('password').value;
      const month = document.getElementById('bulan').value;
      const btn = document.getElementById('btn-login');
      const errorMsg = document.getElementById('error-msg');
      
      btn.innerText = 'Memeriksa...';
      btn.disabled = true;
      errorMsg.classList.add('hidden');

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', nip: nip, password: pass, month: month })
        });
        
        const result = await response.json();

        btn.innerText = 'Masuk';
        btn.disabled = false;
        
        if (result.status === 'success') {
          tampilkanData(result.data, result.month);
        } else {
          errorMsg.innerText = result.message;
          errorMsg.classList.remove('hidden');
        }
      } catch (error) {
        btn.innerText = 'Masuk';
        btn.disabled = false;
        errorMsg.innerText = "Terjadi kesalahan jaringan. Coba lagi.";
        errorMsg.classList.remove('hidden');
      }
    }
